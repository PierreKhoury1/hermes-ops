<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Atlas Vision — Live theatre</title>
<style>
  :root{--bg:#0b0e13;--panel:#10151d;--line:#222a35;--blue:#4c90f0;--btn:#2d72d2;--txt:#dbe2ea;--dim:#7d8896}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.45 Inter,system-ui,Segoe UI,Arial,sans-serif}
  header{display:flex;align-items:center;gap:14px;padding:12px 18px;border-bottom:1px solid var(--line);background:var(--panel)}
  header h1{font-size:15px;margin:0;letter-spacing:.4px}
  header .mono{font-family:'IBM Plex Mono',Consolas,monospace;font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:1px}
  .ctl{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  select,input[type=number]{background:#0d1219;color:var(--txt);border:1px solid var(--line);border-radius:2px;padding:6px 8px;font-size:12px}
  .btn{background:var(--btn);border:0;color:#fff;padding:7px 14px;border-radius:2px;font-size:13px;cursor:pointer}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--txt)}
  .btn:disabled{opacity:.5;cursor:default}
  #grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(560px,1fr));gap:14px;padding:14px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:3px;display:grid;grid-template-columns:1fr 1fr;min-height:280px}
  .vwrap{position:relative;background:#000;border-right:1px solid var(--line)}
  .vwrap video{width:100%;height:100%;object-fit:contain;display:block;min-height:260px}
  .vlabel{position:absolute;top:8px;left:8px;background:rgba(11,14,19,.82);border:1px solid var(--line);padding:3px 8px;
          font-family:Consolas,monospace;font-size:11px;letter-spacing:.5px}
  .flash{position:absolute;inset:0;border:2px solid var(--blue);opacity:0;pointer-events:none;transition:opacity .15s}
  .overlay{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  .counts{position:absolute;bottom:8px;left:8px;background:rgba(11,14,19,.82);border:1px solid var(--line);padding:3px 8px;
          font-family:Consolas,monospace;font-size:11px;color:#31c48d;min-height:14px}
  .llm{display:flex;flex-direction:column;min-width:0}
  .llmhead{display:flex;gap:8px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line);font-family:Consolas,monospace;font-size:11px;color:var(--dim)}
  .llmhead .model{color:var(--blue)}
  .dot{width:7px;height:7px;border-radius:50%;background:#3a4553;flex:none}
  .dot.live{background:#31c48d;box-shadow:0 0 6px #31c48d}
  .dot.think{background:var(--blue);box-shadow:0 0 6px var(--blue);animation:pulse .9s infinite}
  @keyframes pulse{50%{opacity:.35}}
  .notes{flex:1;overflow-y:auto;padding:10px 12px;font-size:12.5px}
  .note{margin-bottom:9px;padding-bottom:9px;border-bottom:1px dashed #1a212c}
  .note .ts{font-family:Consolas,monospace;font-size:10.5px;color:var(--dim);margin-bottom:2px;display:flex;gap:8px}
  .note .ts .lat{color:#557}
  .note.cur .body::after{content:'▌';color:var(--blue);animation:pulse .9s infinite}
  .empty{color:var(--dim);padding:18px;font-size:12.5px}
  #drop{margin:14px;padding:34px;border:1.5px dashed var(--line);border-radius:3px;text-align:center;color:var(--dim);cursor:pointer}
  #drop.on{border-color:var(--blue);color:var(--txt)}
  footer{padding:10px 18px;color:var(--dim);font-size:11.5px;font-family:Consolas,monospace}
</style>
</head>
<body>
<header>
  <h1>ATLAS VISION</h1><span class="mono">live theatre</span>
  <div class="ctl">
    <span class="mono">model</span>
    <select id="model">
      <option value="">server default</option>
      <option value="nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free">nemotron-3-nano-omni (free, vision)</option>
      <option value="anthropic/claude-haiku-4.5">claude-haiku-4.5 (paid)</option>
      <option value="google/gemini-2.5-flash">gemini-2.5-flash (paid)</option>
    </select>
    <span class="mono">quiet gap</span><input type="number" id="cadence" value="20" min="5" max="120" style="width:54px"><span class="mono">s</span>
    <button class="btn" id="start" onclick="toggle()">Start watching</button>
    <button class="btn ghost" onclick="document.getElementById('files').click()">Add feeds</button>
  </div>
</header>
<input type="file" id="files" accept="video/*" multiple hidden>
<div id="drop">Drop video files here (or click) — each becomes a live feed with its own analyst.<br>
<span style="font-size:11px">Videos play locally; only small frames go to the model. Every note is logged to the desk's vision event log.</span></div>
<div id="grid"></div>
<footer id="stat">0 feeds · idle</footer>
<script>
const $=s=>document.querySelector(s);
let feeds=[], running=false, seq=0;
const drop=$('#drop'), files=$('#files');
drop.onclick=()=>files.click();
drop.ondragover=e=>{e.preventDefault();drop.classList.add('on')};
drop.ondragleave=()=>drop.classList.remove('on');
drop.ondrop=e=>{e.preventDefault();drop.classList.remove('on');addFiles(e.dataTransfer.files)};
files.onchange=()=>addFiles(files.files);

function addFeed(name, src){
  const id='f'+(++seq);
  const card=document.createElement('div'); card.className='card'; card.id=id;
  card.innerHTML=`
    <div class="vwrap"><video src="${src}" muted loop playsinline crossorigin="anonymous"></video>
      <canvas class="overlay"></canvas><div class="vlabel">${name}</div><div class="counts"></div><div class="flash"></div></div>
    <div class="llm"><div class="llmhead"><span class="dot"></span>
      <span class="model">analyst</span><span class="minfo">idle</span><span style="margin-left:auto" class="tok"></span></div>
      <div class="notes"><div class="empty">Press <b>Start watching</b> — the analyst narrates this feed as it plays.</div></div></div>`;
  document.querySelector('#grid').appendChild(card);
  const feed={id, name, card, video:card.querySelector('video'), notes:[], busy:false, timer:null, lastCounts:'', lastNarr:0, det:null};
  feed.video.play().catch(()=>{});
  feeds.push(feed); stat();
  return feed;
}

function safeCadence(){
  // narration is change-driven now; the quiet-gap heartbeat only fills silence.
  return Math.max(15, Math.ceil(feeds.length * 60 / 16));
}

async function boot(){
  const q=new URLSearchParams(location.search);
  try{
    const r=await fetch('/api/theatre/clips'); const j=await r.json();
    if((j.clips||[]).length && (q.get('auto')==='1' || q.get('auto')==='start')){
      document.getElementById('drop').style.display='none';
      for(const c of j.clips) addFeed(c.replace(/\.mp4$/,''), '/desk/theatre/clip/'+encodeURIComponent(c));
      document.getElementById('cadence').value = safeCadence();
      if(!running) toggle();
    } else if((j.clips||[]).length){
      drop.innerHTML = `Drop video files here — or <b style="cursor:pointer;color:var(--blue)" onclick="location.search='?auto=1'">load the ${j.clips.length} server clips and start</b>.`;
    }
  }catch(e){}
}
boot();

function addFiles(list){
  for(const f of list){
    if(!f.type.startsWith('video/')) continue;
    const id='f'+(++seq);
    const card=document.createElement('div'); card.className='card'; card.id=id;
    card.innerHTML=`
      <div class="vwrap"><video src="${URL.createObjectURL(f)}" muted loop playsinline></video>
        <canvas class="overlay"></canvas><div class="vlabel">${f.name.replace(/\.[^.]+$/,'')}</div><div class="counts"></div><div class="flash"></div></div>
      <div class="llm"><div class="llmhead"><span class="dot"></span>
        <span class="model">analyst</span><span class="minfo">idle</span><span style="margin-left:auto" class="tok"></span></div>
        <div class="notes"><div class="empty">Press <b>Start watching</b> — the analyst narrates this feed as it plays.</div></div></div>`;
    $('#grid').appendChild(card);
    const feed={id, name:f.name.replace(/\.[^.]+$/,''), card, video:card.querySelector('video'),
                notes:[], busy:false, timer:null, lastCounts:'', lastNarr:0, det:null};
    feed.video.play().catch(()=>{});
    feeds.push(feed);
  }
  stat();
}

function stat(msg){ $('#stat').textContent = feeds.length+' feeds · '+(msg||(running?'watching':'idle')); }

function toggle(){
  running=!running;
  $('#start').textContent = running?'Pause':'Start watching';
  feeds.forEach((f,i)=>{
    if(running){ f.video.play().catch(()=>{}); setTimeout(()=>loop(f), i*1500); }  // stagger the analysts
    else clearTimeout(f.timer);
  });
  stat();
}

let detBusy=false;
async function loop(feed){
  if(!running) return;
  await tick(feed);
  feed.timer=setTimeout(()=>loop(feed), 1200);
}

async function tick(feed){
  if(feed.video.readyState<2) return;
  // 1) local YOLO — fast, free, draws the live overlay
  let changed=false;
  if(!detBusy){
    detBusy=true;
    try{
      const r=await fetch('/api/vision/detect',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({image:grabFrame(feed.video)})});
      const j=await r.json();
      if(j && j.detector){
        drawBoxes(feed, j.boxes||[]);
        const key=Object.entries(j.counts||{}).map(([k,v])=>k+':'+v).join(',');
        feed.card.querySelector('.counts').textContent = key.replaceAll(',', '  ') || '—';
        if(key!==feed.lastCounts){ changed=true; feed.lastCounts=key; }
      }
    }catch(e){}
    detBusy=false;
  }
  // 2) narrate the moment something changes, else keep a heartbeat every quiet-gap seconds
  const quiet=(+$('#cadence').value||20)*1000;
  if(!feed.busy && (changed || Date.now()-feed.lastNarr>quiet)){
    feed.lastNarr=Date.now();
    analyse(feed, changed?'change detected':'heartbeat');
  }
}

function drawBoxes(feed, boxes){
  const v=feed.video, c=feed.card.querySelector('.overlay');
  if(!v.videoWidth) return;
  c.width=v.clientWidth; c.height=v.clientHeight;
  // video uses object-fit:contain — compute letterbox transform
  const s=Math.min(c.width/v.videoWidth, c.height/v.videoHeight);
  const ox=(c.width-v.videoWidth*s)/2, oy=(c.height-v.videoHeight*s)/2;
  const g=c.getContext('2d'); g.clearRect(0,0,c.width,c.height);
  g.strokeStyle='#31c48d'; g.lineWidth=1.5; g.font='10px Consolas'; g.fillStyle='#31c48d';
  // detect ran on a 480px-wide grab — rescale from grab space to video space
  const gs=Math.min(v.videoWidth,480)/v.videoWidth;
  for(const b of boxes){
    const [x1,y1,x2,y2]=b.box.map(n=>n/gs);
    g.strokeRect(ox+x1*s, oy+y1*s, (x2-x1)*s, (y2-y1)*s);
    g.fillText(b.label, ox+x1*s+2, oy+y1*s-2);
  }
}

function grabFrame(v){
  const c=document.createElement('canvas');
  const w=Math.min(v.videoWidth||480,480); c.width=w; c.height=Math.round(w*(v.videoHeight||360)/(v.videoWidth||480));
  c.getContext('2d').drawImage(v,0,0,c.width,c.height);
  return c.toDataURL('image/jpeg',0.7).split(',')[1];
}

async function analyse(feed, reason){
  if(feed.video.readyState<2) return;
  feed.busy=true;
  const head=feed.card.querySelector('.llmhead'), dot=head.querySelector('.dot'),
        minfo=head.querySelector('.minfo'), tok=head.querySelector('.tok'),
        notesEl=feed.card.querySelector('.notes'), flash=feed.card.querySelector('.flash');
  flash.style.opacity=.9; setTimeout(()=>flash.style.opacity=0,180);
  dot.className='dot think'; minfo.textContent='analysing…';
  const vt=feed.video.currentTime, t0=performance.now();
  const div=document.createElement('div'); div.className='note cur';
  div.innerHTML=`<div class="ts"><span>▶ ${vt.toFixed(1)}s</span><span>${reason||''}</span><span class="lat"></span></div><div class="body"></div>`;
  if(notesEl.querySelector('.empty')) notesEl.innerHTML='';
  notesEl.prepend(div);
  const body=div.querySelector('.body');
  try{
    const r=await fetch('/api/vision/live',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({camera:feed.name, image:grabFrame(feed.video), model:$('#model').value,
        context:feed.notes.slice(-3).join('\n'), t:vt.toFixed(1)})});
    if(!r.ok || !r.body){ body.textContent='error: HTTP '+r.status; }
    else{
      const reader=r.body.getReader(), dec=new TextDecoder(); let text='', raw='';
      while(true){ const {done,value}=await reader.read(); if(done) break;
        raw+=dec.decode(value);
        if(raw.startsWith('\x01')){
          const nl=raw.indexOf('\n');
          if(nl<0) continue;
          try{ const meta=JSON.parse(raw.slice(1,nl));
               head.querySelector('.model').textContent=meta.provider+' · '+meta.model.split('/').pop(); }catch(e){}
          raw=raw.slice(nl+1);
        }
        text=raw; body.textContent=text; tok.textContent=text.length+' ch'; }
      feed.notes.push(`[clip ${vt.toFixed(1)}s] `+text);
    }
  }catch(e){ body.textContent='stream failed: '+e.message; }
  div.classList.remove('cur');
  div.querySelector('.lat').textContent=((performance.now()-t0)/1000).toFixed(1)+'s';
  dot.className='dot live'; minfo.textContent='watching';
  while(notesEl.children.length>40) notesEl.lastChild.remove();
  feed.busy=false;
}
</script>
</body>
</html>
